name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          test -f README.md
          test -f LICENSE
          test -f docs/ARCHITECTURE.md
      - name: Check architecture governance baseline
        run: python3 tools/check-architecture-governance.py

  plugin-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: plugin-sdk/package-lock.json
      - name: Test SDK types and packer
        working-directory: plugin-sdk
        run: |
          npm ci --ignore-scripts
          npm test
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify SDK catalog output with the Kotlin verifier
        run: |
          export CORDIACT_CATALOG_FIXTURE="$RUNNER_TEMP/cordiact-catalog-fixture"
          node plugin-sdk/verification/catalog-interop.mjs "$CORDIACT_CATALOG_FIXTURE"
          ./gradlew -p verification/jvm :core:test --tests com.cordiact.core.plugin.SignedCatalogPublisherInteropTest --no-daemon

  readonly-host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test read-only Host grants, signing and pipe carrier
        run: |
          node --test deepseek-harness/host-follow/test/follow-service.test.mjs \
            deepseek-harness/host-follow/test/ipc-follow.test.mjs \
            deepseek-harness/host-follow/test/pairing-offer.test.mjs \
            deepseek-harness/host-follow/test/pairing-handoff.test.mjs \
            deepseek-harness/host-follow/test/operator-tty.test.mjs
      - name: Verify loopback Host lifecycle and TLS backpressure
        run: |
          node --test deepseek-harness/host-follow/test/local-identity.test.mjs \
            deepseek-harness/host-follow/test/loopback-host.test.mjs \
            deepseek-harness/host-follow/test/tls-backpressure.test.mjs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Kotlin against Node pipe and loopback TLS carriers
        run: |
          ./gradlew -p verification/jvm :deepseek-harness:test :deepseek-harness:followPipeInteropTest \
            -PfollowNode="$(command -v node)" --no-daemon

  readonly-host-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: deepseek-harness/host-follow/test/pinned-dsh/package-lock.json
      - name: Check out the fixed DSH source
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: d98f5d68519215da48f3002da2cb9c9d2068d81d
          path: .dsh-fixture-source
          persist-credentials: false
      - name: Verify the fixed-version Host profile without a listener
        run: node deepseek-harness/host-follow/test/run-pinned-profile.mjs .dsh-fixture-source
