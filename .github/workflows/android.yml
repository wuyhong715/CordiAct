name: Android build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        run: |
          test -n "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Build and test
        run: ./gradlew test assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: cordiact-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  isolated-service-proof:
    name: Android isolated-service proof (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 35]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Reclaim disposable runner space for emulator
        run: |
          df -h "$HOME"
          if [ -d /usr/share/dotnet ]; then
            du -sh /usr/share/dotnet
            sudo rm -rf -- /usr/share/dotnet
          fi
          df -h "$HOME"
      - name: Install Android native build toolchain
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Grant the runner user access to KVM
        run: |
          test -e /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm
      - name: Run isolated-process instrumentation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          disable-linux-hw-accel: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set +e
            prior_force_idle="$(adb shell dumpsys deviceidle | sed -n 's/.*mForceIdle=\(true\|false\).*/\1/p' | head -n1 | tr -d '\r')"
            case "$prior_force_idle" in
              true|false) ;;
              *) echo "Cannot determine emulator force-idle state; refusing Doze instrumentation" >&2; exit 1 ;;
            esac
            restore_device_idle() {
              if [ "$prior_force_idle" = "false" ]; then
                adb shell cmd deviceidle unforce >/dev/null 2>&1 || true
              fi
            }
            trap restore_device_idle EXIT
            ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace --info
            test_exit=$?
            mkdir -p app/build/sandbox-validation
            adb logcat -d -s CordiActS23:I > "app/build/sandbox-validation/api-${{ matrix.api-level }}.log" 2>&1 || true
            exit "$test_exit"
      - name: Preserve sandbox instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-service-test-reports-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/connected/debug/**
            app/build/outputs/androidTest-results/connected/debug/**
            app/build/sandbox-validation/**
          if-no-files-found: warn
      - name: Package APKs for real-device sandbox validation
        if: matrix.api-level == 35
        uses: actions/upload-artifact@v4
        with:
          name: cordiact-device-validation-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
