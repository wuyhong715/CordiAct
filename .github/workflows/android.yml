name: Android build

on:
  pull_request:
    branches: [main]
    # `labeled` is not a default activity type: without it, adding the
    # `emulator` label to an open PR would not start the proof job.
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

permissions:
  contents: read

# A newer push to the same ref supersedes the run still in flight, except on
# main, where every merged commit should get a full result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify preinstalled Android SDK
        run: |
          test -n "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Build and test
        run: ./gradlew test assembleDebug --no-daemon
      - name: Assemble release and verify debug probe is absent
        run: |
          ./gradlew :app:assembleRelease --no-daemon
          MANIFEST=$(find app/build/intermediates/merged_manifests/release -name AndroidManifest.xml | head -1)
          test -n "$MANIFEST"
          if grep -q "AutomationProbeReceiver" "$MANIFEST"; then
            echo "release merged manifest still contains AutomationProbeReceiver" >&2
            exit 1
          fi
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$APK"
          if unzip -p "$APK" AndroidManifest.xml | strings | grep -q "AutomationProbeReceiver"; then
            echo "release APK manifest still contains AutomationProbeReceiver" >&2
            exit 1
          fi
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cordiact-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: cordiact-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  isolated-service-proof:
    name: Android isolated-service proof (API ${{ matrix.api-level }})
    # Two emulator legs cost ~12 min per run. Keep them off the routine push
    # path: they run on main, on demand, or on a PR labelled `emulator`.
    if: >
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'emulator')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 35]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Reclaim disposable runner space for emulator
        run: |
          df -h "$HOME"
          if [ -d /usr/share/dotnet ]; then
            du -sh /usr/share/dotnet
            sudo rm -rf -- /usr/share/dotnet
          fi
          df -h "$HOME"
      - name: Install Android native build toolchain
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Grant the runner user access to KVM
        run: |
          test -e /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm
      - name: Run isolated-process instrumentation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          disable-linux-hw-accel: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/run-sandbox-instrumentation.sh ${{ matrix.api-level }}
      - name: Preserve sandbox instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-service-test-reports-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/connected/debug/**
            app/build/outputs/androidTest-results/connected/debug/**
            app/build/sandbox-validation/**
          if-no-files-found: warn
          retention-days: 14
      - name: Package APKs for real-device sandbox validation
        if: matrix.api-level == 35
        uses: actions/upload-artifact@v4
        with:
          name: cordiact-device-validation-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 14
