<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CordiAct Render Surface</title>
  <style>
    /* The host page owns only the stage. Everything the agent writes lives in the iframe,
       so no style from here can leak into a preview (see preview.js). */
    html, body { margin: 0; padding: 0; background: #0f1012; height: 100%; }
    #stage {
      position: absolute; left: 50%; top: 50%;
      transform-origin: center center;
      background: #fff; overflow: hidden;
      box-shadow: 0 8px 40px rgba(0, 0, 0, .45);
      border-radius: 6px;
      contain: strict;
    }
    #frame { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
    #boot { position: absolute; inset: 0; display: grid; place-items: center;
            color: #888; font: 13px/1.5 system-ui, sans-serif; }
  </style>
</head>
<body>
  <div id="stage"><iframe id="frame" title="preview"></iframe></div>
  <div id="boot">render surface</div>
  <script src="preview.js"></script>
</body>
</html>
